spring.application.name=apteka
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:mariadb://localhost:3306/Apteka
spring.datasource.username=root
spring.datasource.password=haslo
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# DATETIME values are stored and exposed in UTC.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# In-memory browser sessions; enable Secure cookies when serving through HTTPS.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=${server.servlet.context-path}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
