spring.application.name=apteka
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:mariadb://localhost:3306/Apteka
spring.datasource.username=root
spring.datasource.password=haslo
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# DATETIME values are stored and exposed in UTC.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
