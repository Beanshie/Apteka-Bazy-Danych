openapi: 3.0.3
info:
  title: API Apteki — Uwierzytelnianie
  version: 2.0.0
  description: >-
    Sesje klientów i pracowników w pamięci aplikacji. Istniejące zasoby zachowują
    dotychczasowe reguły dostępu. Przeglądarka przesyła ciasteczko JSESSIONID.
    Pobierz token CSRF przed logowaniem oraz ponownie po logowaniu lub wylogowaniu.
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: getAuthCsrf
      summary: Pobranie tokenu CSRF
      responses:
        '200':
          description: Token dla nagłówka X-CSRF-TOKEN; może utworzyć anonimową sesję.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCsrf'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginAuth
      summary: Logowanie klienta lub pracownika
      description: >-
        Zmienia identyfikator sesji i unieważnia wcześniejszy token CSRF.
        Nieistniejące konto, niepoprawne hasło i nieaktywny pracownik zwracają 401.
        Hasło nie jest przycinane ani normalizowane; limit BCrypt to 72 bajty UTF-8.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      responses:
        '200':
          description: Zalogowano; ciasteczko JSESSIONID identyfikuje sesję.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: JSESSIONID z HttpOnly, SameSite=Lax i ścieżką /api/v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          description: Niepoprawne dane wejściowe.
        '401':
          description: Niepoprawne dane logowania.
        '403':
          description: Brak lub niepoprawny token CSRF.
        '500':
          description: Wewnętrzny błąd serwera.
  /auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Bieżący użytkownik
      description: >-
        Odczytuje aktualne dane konta. Usunięte konto lub nieaktywny pracownik
        unieważnia sesję i zwraca 401.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Dane zalogowanego użytkownika.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Brak ważnej uwierzytelnionej sesji.
        '500':
          description: Wewnętrzny błąd serwera.
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutAuth
      summary: Wylogowanie
      description: >-
        Unieważnia sesję i token CSRF, usuwa ciasteczko sesji. Dopuszcza anonimową
        sesję z poprawnym tokenem CSRF. Wygasła sesja wymaga pobrania nowego tokenu.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Wylogowano.
        '403':
          description: Brak lub niepoprawny token CSRF.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token zwrócony przez GET /auth/csrf dla tej samej sesji.
      schema:
        type: string
  schemas:
    TypKonta:
      type: string
      enum: [KLIENT, PRACOWNIK]
    AuthLogin:
      type: object
      required: [typ_konta, identyfikator, haslo]
      properties:
        typ_konta:
          $ref: '#/components/schemas/TypKonta'
        identyfikator:
          type: string
          minLength: 1
          maxLength: 100
          description: Email klienta (do 100 znaków) albo login pracownika (do 50 znaków).
        haslo:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: Hasło; maksymalnie 72 bajty UTF-8.
    AuthUser:
      type: object
      required: [id, typ_konta, identyfikator, imie, nazwisko, rola]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        typ_konta:
          $ref: '#/components/schemas/TypKonta'
        identyfikator:
          type: string
        imie:
          type: string
        nazwisko:
          type: string
        rola:
          type: string
          nullable: true
          description: FARMACEUTA, KIEROWNIK lub ADMIN dla pracownika; null dla klienta.
    AuthCsrf:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-CSRF-TOKEN
