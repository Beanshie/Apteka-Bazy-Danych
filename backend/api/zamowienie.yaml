openapi: 3.0.3
info:
  title: API Apteki — Zamowienie
  version: 2.0.0
  description: Zamówienia tworzone wraz z pozycjami. Suma i ceny pozycji są wyliczane
    przez backend.
servers:
- url: /api/v1
paths:
  /zamowienia:
    get:
      tags:
      - Zamowienie
      operationId: listZamowienie
      summary: Lista — Zamowienie
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zamowienie'
      parameters:
      - name: id_klienta
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          example: 1
      - name: status_zamowienia
        in: query
        required: false
        schema:
          type: string
          maxLength: 20
          enum: &id001
          - NOWE
          - OPLACONE
          - W_REALIZACJI
          - WYSLANE
          - ZREALIZOWANE
          - ANULOWANE
    post:
      tags:
      - Zamowienie
      operationId: createZamowienie
      summary: Utworzenie — Zamowienie
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '201':
          description: Utworzono zasób.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zamowienie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZamowienieCreate'
  /zamowienia/{id_zamowienia}:
    parameters:
    - name: id_zamowienia
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    get:
      tags:
      - Zamowienie
      operationId: getZamowienie
      summary: Pobranie — Zamowienie
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zamowienie'
    put:
      tags:
      - Zamowienie
      operationId: updateZamowienie
      summary: Aktualizacja — Zamowienie
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zamowienie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZamowienieUpdate'
      description: Zastępuje wszystkie edytowalne dane zasobu. Pola nullable pominięte
        lub ustawione na null są czyszczone.
    delete:
      tags:
      - Zamowienie
      operationId: deleteZamowienie
      summary: Usunięcie — Zamowienie
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '204':
          description: Usunięto zasób lub zasób już nie istnieje.
      description: Usuwa zamówienie, jego pozycje i płatność kaskadowo.
components:
  schemas:
    Zamowienie:
      type: object
      properties:
        id_zamowienia:
          type: integer
          format: int32
          minimum: 1
          example: 1
          readOnly: true
        id_klienta:
          type: integer
          format: int32
          minimum: 1
          example: 1
        id_adresu:
          type: integer
          format: int32
          minimum: 1
          example: 1
        data_zamowienia:
          type: string
          format: date-time
          example: '2026-10-01T10:15:00Z'
          description: Data i czas; warstwa API odpowiada za konwersję strefy czasowej
            dla MariaDB DATETIME.
          readOnly: true
        status_zamowienia:
          type: string
          maxLength: 20
          default: NOWE
          enum: *id001
        suma_calkowita:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          example: 12.5
          default: 0.0
          readOnly: true
        pozycje:
          type: array
          items:
            $ref: szczegol_zamowienia.yaml#/components/schemas/SzczegolZamowienia
      required:
      - id_zamowienia
      - id_klienta
      - id_adresu
      - data_zamowienia
      - status_zamowienia
      - suma_calkowita
      - pozycje
    ZamowienieCreate:
      type: object
      properties:
        id_klienta:
          type: integer
          format: int32
          minimum: 1
          example: 1
        id_adresu:
          type: integer
          format: int32
          minimum: 1
          example: 1
        status_zamowienia:
          type: string
          maxLength: 20
          default: NOWE
          enum:
          - NOWE
          - OPLACONE
          - W_REALIZACJI
          - WYSLANE
          - ZREALIZOWANE
          - ANULOWANE
        pozycje:
          type: array
          minItems: 1
          items:
            $ref: szczegol_zamowienia.yaml#/components/schemas/SzczegolZamowieniaCreate
          description: Produkty nie mogą się powtarzać. Cena jest pobierana z katalogu;
            backend oblicza sumę. Dla produktu wymagającego recepty należy przekazać
            id_recepty.
      required:
      - id_klienta
      - id_adresu
      - pozycje
    ZamowienieUpdate:
      type: object
      properties:
        id_klienta:
          type: integer
          format: int32
          minimum: 1
          example: 1
        id_adresu:
          type: integer
          format: int32
          minimum: 1
          example: 1
        status_zamowienia:
          type: string
          maxLength: 20
          enum:
          - NOWE
          - OPLACONE
          - W_REALIZACJI
          - WYSLANE
          - ZREALIZOWANE
          - ANULOWANE
        pozycje:
          type: array
          minItems: 1
          items:
            $ref: szczegol_zamowienia.yaml#/components/schemas/SzczegolZamowieniaCreate
          description: Pełna lista zastępuje wszystkie pozycje; backend zapisuje aktualne
            ceny produktów i ponownie oblicza sumę.
      required:
      - id_klienta
      - id_adresu
      - status_zamowienia
      - pozycje
