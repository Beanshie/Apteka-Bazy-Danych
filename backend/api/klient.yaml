openapi: 3.0.3
info:
  title: API Apteki - Klienci
  version: 1.0.0
  description: Interfejs API do zarządzania klientami apteki z autoryzacją.
servers:
  - url: /api/v1

paths:
  /klienci:
    get:
      summary: Pobranie listy klientów
      operationId: listKlienci
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Klient'
        '401':
          description: nie autoryzowany
        '500':
          description: wewnetrzny blad przetwarzania
    post:
      summary: Rejestracja klienta
      description: Tworzy konto klienta na podstawie loginu, hasła i opcjonalnych danych adresowych.
      operationId: createKlient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtworzenieKlienta'
      responses:
        '201':
          description: Utworzono klienta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Klient'
        '400':
          description: bledne dane/powtorzony login
        '500':
          description: wewnetrzny blad przetwarzania

  /klient/{klient_id}:
    parameters:
      - name: klient_id
        in: path
        required: true
        description: Klient ID
        schema:
          type: integer
          format: int64
    get:
      summary: Pobranie klienta
      operationId: getKlient
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Klient'
        '401':
          description: nie autoryzowany
        '404':
          description: nie znaleziono
        '500':
          description: wewnetrzny blad przetwarzania
    put:
      summary: Aktualizacja klienta
      operationId: updateKlient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AktualizacjaKlienta'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Klient'
        '400':
          description: bledne dane/powtorzony login
        '401':
          description: nie autoryzowany
        '404':
          description: nie znaleziono
        '500':
          description: wewnetrzny blad przetwarzania
    delete:
      summary: Usuwanie klienta
      operationId: deleteKlient
      responses:
        '200':
          description: ok
        '401':
          description: nie autoryzowany
        '404':
          description: nie znaleziono
        '500':
          description: wewnetrzny blad przetwarzania

components:
  schemas:
    DaneKlienta:
      type: object
      properties:
        imie:
          type: string
          maxLength: 32
          example: 'Jan'
        nazwisko:
          type: string
          maxLength: 64
          example: 'Kowalski'
        ulica:
          type: string
          maxLength: 255
          example: 'Floriańska'
        numer_domu:
          type: string
          maxLength: 30
          example: '12/3'
        kod_pocztowy:
          type: string
          maxLength: 20
          example: '31-019'
        miasto:
          type: string
          maxLength: 64
          example: 'Kraków'
        kraj:
          type: string
          maxLength: 64
          example: 'Polska'

    Klient:
      allOf:
        - $ref: '#/components/schemas/DaneKlienta'
        - type: object
          required:
            - klient_id
            - login
          properties:
            klient_id:
              type: integer
              format: int64
              readOnly: true
              description: Unikalny identyfikator klienta (PK, Auto-Increment)
              example: 1
            login:
              type: string
              maxLength: 32
              example: 'jan_kowalski'

    UtworzenieKlienta:
      allOf:
        - $ref: '#/components/schemas/DaneKlienta'
        - type: object
          required:
            - login
            - haslo
          properties:
            login:
              type: string
              maxLength: 32
              example: 'jan_kowalski'
            haslo:
              type: string
              format: password
              example: 'MojeBezpieczneHaslo123!'

    AktualizacjaKlienta:
      allOf:
        - $ref: '#/components/schemas/DaneKlienta'
        - type: object
          required:
            - login
          properties:
            login:
              type: string
              maxLength: 32
              example: 'jan_kowalski'
            haslo:
              type: string
              format: password
              description: Nowe hasło (jeśli pominięte, hasło nie jest zmieniane)
              example: 'NoweBezpieczneHaslo456!'