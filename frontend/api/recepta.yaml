openapi: 3.0.3
info:
  title: API Apteki — Recepta
  version: 2.0.0
  description: Zarządzanie zasobem Recepta.
servers:
- url: /api/v1
paths:
  /recepty:
    get:
      tags:
      - Recepta
      operationId: listRecepta
      summary: Lista — Recepta
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recepta'
      parameters:
      - name: id_klienta
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          example: 1
      - name: kod_recepty
        in: query
        required: false
        schema:
          type: string
          maxLength: 10
      - name: status_recepty
        in: query
        required: false
        schema:
          type: string
          maxLength: 20
          enum: &id001
          - NOWA
          - ZWERYFIKOWANA
          - ZREALIZOWANA
          - ODRZUCONA
    post:
      tags:
      - Recepta
      operationId: createRecepta
      summary: Utworzenie — Recepta
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '201':
          description: Utworzono zasób.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recepta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptaCreate'
  /recepty/{id_recepty}:
    parameters:
    - name: id_recepty
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    get:
      tags:
      - Recepta
      operationId: getRecepta
      summary: Pobranie — Recepta
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recepta'
    put:
      tags:
      - Recepta
      operationId: updateRecepta
      summary: Aktualizacja — Recepta
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recepta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptaUpdate'
      description: Zastępuje wszystkie edytowalne dane zasobu. Pola nullable pominięte
        lub ustawione na null są czyszczone.
    delete:
      tags:
      - Recepta
      operationId: deleteRecepta
      summary: Usunięcie — Recepta
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '204':
          description: Usunięto zasób.
      description: Usuwa receptę; id_recepty w powiązanych pozycjach zostaje ustawione
        na null.
components:
  schemas:
    Recepta:
      type: object
      properties:
        id_recepty:
          type: integer
          format: int32
          minimum: 1
          example: 1
          readOnly: true
        id_klienta:
          type: integer
          format: int32
          minimum: 1
          example: 1
        kod_recepty:
          type: string
          maxLength: 10
        pesel_pacjenta:
          type: string
          maxLength: 11
        status_recepty:
          type: string
          maxLength: 20
          default: NOWA
          enum: *id001
      required:
      - id_recepty
      - id_klienta
      - kod_recepty
      - pesel_pacjenta
      - status_recepty
    ReceptaCreate:
      type: object
      properties:
        id_klienta:
          type: integer
          format: int32
          minimum: 1
          example: 1
        kod_recepty:
          type: string
          maxLength: 10
        pesel_pacjenta:
          type: string
          maxLength: 11
        status_recepty:
          type: string
          maxLength: 20
          default: NOWA
          enum:
          - NOWA
          - ZWERYFIKOWANA
          - ZREALIZOWANA
          - ODRZUCONA
      required:
      - id_klienta
      - kod_recepty
      - pesel_pacjenta
    ReceptaUpdate:
      type: object
      properties:
        id_klienta:
          type: integer
          format: int32
          minimum: 1
          example: 1
        kod_recepty:
          type: string
          maxLength: 10
        pesel_pacjenta:
          type: string
          maxLength: 11
        status_recepty:
          type: string
          maxLength: 20
          enum:
          - NOWA
          - ZWERYFIKOWANA
          - ZREALIZOWANA
          - ODRZUCONA
      required:
      - id_klienta
      - kod_recepty
      - pesel_pacjenta
      - status_recepty
