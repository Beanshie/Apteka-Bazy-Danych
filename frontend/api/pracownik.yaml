openapi: 3.0.3
info:
  title: API Apteki — Pracownik
  version: 2.0.0
  description: Zarządzanie zasobem Pracownik.
servers:
- url: /api/v1
paths:
  /pracownicy:
    get:
      tags:
      - Pracownik
      operationId: listPracownik
      summary: Lista — Pracownik
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pracownik'
    post:
      tags:
      - Pracownik
      operationId: createPracownik
      summary: Utworzenie — Pracownik
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '201':
          description: Utworzono zasób.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pracownik'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracownikCreate'
  /pracownicy/{id_pracownika}:
    parameters:
    - name: id_pracownika
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    get:
      tags:
      - Pracownik
      operationId: getPracownik
      summary: Pobranie — Pracownik
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pracownik'
    put:
      tags:
      - Pracownik
      operationId: updatePracownik
      summary: Aktualizacja — Pracownik
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '200':
          description: Operacja zakończona pomyślnie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pracownik'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracownikUpdate'
      description: Zastępuje wszystkie edytowalne dane zasobu. Pola nullable pominięte
        lub ustawione na null są czyszczone. Hasło null zachowuje dotychczasowe hasło.
    delete:
      tags:
      - Pracownik
      operationId: deletePracownik
      summary: Usunięcie — Pracownik
      responses:
        '400':
          description: Błędne dane wejściowe, status lub powiązanie; brak wymaganej
            recepty albo niewystarczający stan magazynowy dla operacji na pozycjach.
        '401':
          description: Brak autoryzacji.
        '500':
          description: Wewnętrzny błąd serwera.
        '404':
          description: Nie znaleziono zasobu lub wskazanego powiązanego rekordu.
        '409':
          description: Konflikt unikalności lub operacja zablokowana przez powiązane
            rekordy.
        '204':
          description: Usunięto zasób.
      description: Usuwa wskazany zasób.
components:
  schemas:
    Pracownik:
      type: object
      properties:
        id_pracownika:
          type: integer
          format: int32
          minimum: 1
          example: 1
          readOnly: true
        login:
          type: string
          maxLength: 50
        imie:
          type: string
          maxLength: 50
        nazwisko:
          type: string
          maxLength: 50
        rola:
          type: string
          maxLength: 30
          default: FARMACEUTA
          enum:
          - FARMACEUTA
          - KIEROWNIK
          - ADMIN
        aktywny:
          type: boolean
          example: true
          default: true
      required:
      - id_pracownika
      - login
      - imie
      - nazwisko
      - rola
      - aktywny
    PracownikCreate:
      type: object
      properties:
        login:
          type: string
          maxLength: 50
        haslo:
          type: string
          maxLength: 255
          format: password
          writeOnly: true
          description: Hasło wejściowe; backend zapisuje wyłącznie jego skrót.
        imie:
          type: string
          maxLength: 50
        nazwisko:
          type: string
          maxLength: 50
        rola:
          type: string
          maxLength: 30
          default: FARMACEUTA
          enum:
          - FARMACEUTA
          - KIEROWNIK
          - ADMIN
        aktywny:
          type: boolean
          example: true
          default: true
      required:
      - login
      - haslo
      - imie
      - nazwisko
    PracownikUpdate:
      type: object
      properties:
        login:
          type: string
          maxLength: 50
        haslo:
          type: string
          maxLength: 255
          format: password
          writeOnly: true
          description: Nowe hasło. Null lub pominięcie zachowuje dotychczasowe hasło.
          nullable: true
        imie:
          type: string
          maxLength: 50
        nazwisko:
          type: string
          maxLength: 50
        rola:
          type: string
          maxLength: 30
          enum:
          - FARMACEUTA
          - KIEROWNIK
          - ADMIN
        aktywny:
          type: boolean
          example: true
      required:
      - login
      - imie
      - nazwisko
      - rola
      - aktywny
