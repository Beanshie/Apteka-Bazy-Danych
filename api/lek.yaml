openapi: 3.0.3
info:
  title: API Apteki - Leki
  version: 1.0.0
  description: Interfejs API do zarządzania bazą leków.
servers:
  - url: /api/v1

# Domyślne zabezpieczenie dla całego API (wymaga tokena Bearer)
security:
  - bearerAuth: []

paths:
  /leki:
    get:
      summary: Pobierz listę wszystkich leków
      operationId: getLeki
      security: [] # Lista lekow jest dostepna publicznie
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lek'
        '500':
          description: wewnetrzny blad przetwarzania
    post:
      summary: Dodaj nowy lek do bazy
      operationId: addLek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaneLek'
      responses:
        '201':
          description: Utworzono nowy lek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lek'
        '400':
          description: Błędne dane wejściowe
        '500':
          description: wewnetrzny blad przetwarzania
  /leki/{lek_ID}:
    parameters:
      - name: lek_ID
        in: path
        required: true
        description: Unikalny identyfikator leku
        schema:
          type: integer
    get:
      summary: Pobierz szczegóły leku
      operationId: getLekById
      security: [] # Pobranie leku jest publiczne
      responses:
        '200':
          description: Pomyślnie pobrano lek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lek'
        '404':
          description: Nie znaleziono leku o podanym ID
        '500':
          description: wewnetrzny blad przetwarzania
    put:
      summary: Zaktualizuj dane istniejącego leku
      operationId: updateLek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaneLek'
      responses:
        '200':
          description: Pomyślnie zaktualizowano lek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lek'
        '404':
          description: Nie znaleziono leku
        '500':
          description: wewnetrzny blad przetwarzania

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Wprowadź token JWT otrzymany z endpointu /pracownik/login'

  schemas:
    DaneLek:
      type: object
      required:
        - nazwa
        - cena
        - opis
      properties:
        nazwa:
          type: string
          maxLength: 32
          description: Nazwa handlowa leku
          example: "Paracetamol 500mg"
        cena:
          type: number
          format: float
          description: Cena leku
          example: 12.99
        opis:
          type: string
          maxLength: 256
          description: Szczegółowy opis działania i dawkowania
          example: "Lek przeciwbólowy i przeciwgorączkowy."
        wymagana_Recepta:
          type: boolean
          default: false
          description: Czy lek wydawany jest wyłącznie z przepisu lekarza
          example: false
        dostepne:
          type: integer
          default: 0
          description: Liczba aktualnie dostępnych sztuk
          example: 150
    Lek:
      allOf:
        - $ref: "#/components/schemas/DaneLek"
        - type: object
        - required:
          - lek_ID
          properties:
            lek_ID:
              type: integer
              readOnly: true
              description: Unikalny identyfikator leku (PK, Auto-Increment)
              example: 1
        
