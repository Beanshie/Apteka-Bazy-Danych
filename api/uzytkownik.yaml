openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: Proste API do zarządzania użytkownikami z autoryzacją.

# Domyślne zabezpieczenie dla całego API (wymaga tokena Bearer)
security:
  - bearerAuth: []

paths:
  /uzytkownik:
    get:
      summary: 'pobranie listy uzytkownikow'
      operationId: list
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Uzytkownik'
        '401':
          description: nie autoryzowany
        '500':
          description: wewnetrzny blad przetwarzania
    post:
      operationId: createUser
      summary: Utworzenie uzytkownika
      description: Pobiera login oraz haslo uzytkownika (rejestracja)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtworzenieUzytkownika'
      responses:
        '201':
          description: 'Utworzono uzytkownika'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uzytkownik'
        '400':
          description: błędne dane
        '500':
          description: wewnetrzny blad przetwarzania

  /uzytkownik/login:
    post:
      operationId: loginUser
      summary: Logowanie użytkownika
      description: Uwierzytelnia użytkownika i zwraca token Bearer JWT.
      security: [] # Logowanie jest publiczne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logowanie'
      responses:
        '200':
          description: Pomyślnie zalogowano
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaneLogowania'
        '400':
          description: Błędny format żądania
        '401':
          description: Nieprawidłowy login lub hasło
        '500':
          description: wewnetrzny blad przetwarzania

  /uzytkownik/{id}:
    get:
      summary: 'pobranie uzytkownika'
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uzytkownik'
        '401':
          description: nie autoryzowany
        '404':
          description: nie znaleziono
        '500':
          description: wewnetrzny blad przetwarzania
    delete:
      summary: 'Usuwanie uzytkownika'
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: ok
        '401':
          description: nie autoryzowany
        '404':
          description: nie znaleziono
        '500':
          description: wewnetrzny blad przetwarzania
    put:
      summary: 'Aktualizacja uzytkownika'
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtworzenieUzytkownika'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uzytkownik'
        '400':
          description: bledne dane/powtorzony login
        '401':
          description: nie autoryzowany
        '404':
          description: nie znaleziono        
        '500':
          description: wewnetrzny blad przetwarzania

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Wprowadź token JWT otrzymany z endpointu /uzytkownik/login'

  parameters:
    userId:
      name: id
      in: path
      required: true
      description: 'Uzytkownik ID'
      schema:
        type: integer
        format: int64

  schemas:
    Uzytkownik:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
      required:
        - id
        - login

    UtworzenieUzytkownika:
      type: object
      properties:
        login:
          type: string
        haslo: 
          type: string
          format: password
      required:
        - login
        - haslo

    Logowanie:
      type: object
      properties:
        login:
          type: string
          example: 'jan_kowalski'
        haslo:
          type: string
          format: password
          example: 'MojeBezpieczneHaslo123!'
      required:
        - login
        - haslo

    DaneLogowania:
      type: object
      properties:
        token:
          type: string
          description: 'Token dostępowy JWT'
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        tokenType:
          type: string
          description: 'Typ tokenu autoryzacyjnego'
          example: 'Bearer'
        expiresIn:
          type: integer
          description: 'Czas ważności tokenu w sekundach'
          example: 3600
        refreshToken:
          type: string
          description: 'Token służący do odświeżania sesji'
          example: 'd9b2d63d-a233-4123-bf3a-79111322f1c8'
      required:
        - token
        - tokenType
        - expiresIn